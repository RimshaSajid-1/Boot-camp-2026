<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Cards</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            HTML
                        </h5>

                        <p class="card-text">
                            Learn the structure of websites using HTML.
                        </p>

                        <button type="button" class="btn btn-primary">
                            Learn HTML
                        </button>

                    </div>

                </div>

            </div>


    
            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            CSS
                        </h5>

                        <p class="card-text">
                            Learn how to style websites using CSS.
                        </p>

                        <button type="button" class="btn btn-success">
                            Learn CSS
                        </button>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h5 class="card-title">
                            JavaScript
                        </h5>

                        <p class="card-text">
                            Learn how to make websites interactive using JavaScript.
                        </p>

                        <button type="button" class="btn btn-danger">
                            Learn JavaScript
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
